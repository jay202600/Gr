<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>아기 양의 비밀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one big friendly screen at a time (intro, guess, scratch-to-reveal), a sheep stage as the anchor, huge tap targets for grandparents. */
:root{
  --bg:#FFF2F5; --surface:#FFFFFF; --ink:#4B3042; --ink-soft:#7A5668; --line:#F3D3DE;
  --rose:#F0719B; --rose-text:#C23A6B;
  --girl:#D9467A; --girl-shadow:#A82E5C; --boy:#2F7BBF; --boy-shadow:#1F5A91;
  --butter:#FFD66B; --focus:#E08A00;
  --grass:#BFE6CF; --sky-a:#CFE8F9; --sky-b:#FFEAF0; --cloud:#FFFFFF;
  --wool:#FFFFFF; --wool-edge:#EBD5DF; --face:#FFD9C8; --face-dark:#F2B7A5; --leg:#7A5668; --sheep-ink:#4B3042;
  --reveal-a:#FFD6E2; --reveal-b:#FFEEF3;
  --font-display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241823; --surface:#38283A; --ink:#FFF0F5; --ink-soft:#DCC2CF; --line:#5A4059;
    --rose:#FF8FB1; --rose-text:#FF9DBB;
    --grass:#35574A; --sky-a:#2E3560; --sky-b:#4D2F4B; --cloud:#5F5A8C;
    --wool:#FFF8FB; --wool-edge:#9C7C90; --leg:#B58AA0;
    --reveal-a:#5E3049; --reveal-b:#46263A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241823; --surface:#38283A; --ink:#FFF0F5; --ink-soft:#DCC2CF; --line:#5A4059;
  --rose:#FF8FB1; --rose-text:#FF9DBB;
  --grass:#35574A; --sky-a:#2E3560; --sky-b:#4D2F4B; --cloud:#5F5A8C;
  --wool:#FFF8FB; --wool-edge:#9C7C90; --leg:#B58AA0;
  --reveal-a:#5E3049; --reveal-b:#46263A;
  color-scheme:dark;
}

html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:20px; line-height:1.6;
  padding-block:20px 44px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.app{max-width:460px; margin:0 auto}
.screen{display:flex; flex-direction:column; align-items:center; text-align:center; gap:18px}
h1,h2{font-family:var(--font-display); font-weight:400; margin:0; line-height:1.25; text-wrap:balance}
h1{font-size:clamp(34px,9.5vw,44px)}
h2{font-size:clamp(28px,7.8vw,34px)}
h1:focus,h2:focus{outline:none}
p{margin:0; max-width:24em; text-wrap:pretty}

.eyebrow{display:inline-flex; align-items:center; gap:8px; font-family:var(--font-display); font-size:21px; color:var(--rose-text); letter-spacing:.06em}

/* Sheep stage */
.stage{position:relative; width:100%; height:292px; border-radius:36px; overflow:hidden; display:grid; place-items:end center;
  background:linear-gradient(180deg,var(--sky-a),var(--sky-b))}
.stage.small{height:224px}
.stage .sheep{position:relative; z-index:2; width:232px; margin-bottom:6px; animation:bob 3.4s ease-in-out infinite; transform-origin:50% 100%}
.stage.small .sheep{width:170px}
.meadow{position:absolute; left:-14%; right:-14%; bottom:-48px; height:132px; border-radius:50%; background:var(--grass); z-index:1}
.cloud{position:absolute; width:96px; z-index:0; fill:var(--cloud); opacity:.92; animation:drift 9s ease-in-out infinite alternate}
.cloud.c1{top:26px; left:7%}
.cloud.c2{top:62px; right:6%; width:72px; animation-duration:11s; animation-direction:alternate-reverse}
.spark{position:absolute; width:20px; z-index:0; fill:var(--butter); animation:twinkle 2.6s ease-in-out infinite}
.spark.s1{top:34px; right:24%}
.spark.s2{top:112px; left:15%; width:14px; animation-delay:.9s}
.spark.s3{top:90px; right:12%; width:12px; animation-delay:1.6s}
.bubble{position:absolute; z-index:3; top:20px; right:16%; background:var(--surface); color:var(--rose-text); font-family:var(--font-display); font-size:34px; line-height:1; padding:12px 20px; border-radius:24px; box-shadow:0 4px 0 var(--line)}
.bubble::after{content:""; position:absolute; left:18px; bottom:-8px; width:18px; height:18px; background:var(--surface); transform:rotate(45deg); border-radius:0 0 6px 0}

.sh-wool{fill:var(--wool)} .sh-edge{fill:var(--wool-edge)} .sh-face{fill:var(--face)} .sh-ear{fill:var(--face-dark)}
.sh-leg{fill:var(--leg)} .sh-ink{fill:var(--sheep-ink)} .sh-hi{fill:#fff} .sh-cheek{fill:var(--rose); opacity:.5}
.sh-mouth{fill:none; stroke:var(--sheep-ink); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.sh-shadow{fill:var(--ink); opacity:.12} .sh-bow{fill:var(--rose)} .sh-bow-mid{fill:var(--girl)}

/* Buttons */
.btn{font-family:var(--font-display); font-size:28px; line-height:1.1; min-height:76px; width:100%; max-width:340px; padding:0 32px;
  border:0; border-radius:999px; color:#fff; background:var(--girl); box-shadow:0 6px 0 var(--girl-shadow); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:10px}
.btn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--girl-shadow)}
.btn:focus-visible{outline:4px solid var(--focus); outline-offset:3px}
.btn.ghost{background:var(--surface); color:var(--ink); box-shadow:none; border:3px solid var(--line); min-height:64px; font-size:23px}
.btn.ghost:active{transform:none; background:var(--line)}

.choices{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; width:100%}
.choice{flex-direction:column; gap:6px; min-height:140px; max-width:none; padding:10px 12px}
.choice .big{font-size:48px; line-height:1}
.choice .sub{font-family:var(--font-body); font-size:17px; opacity:.95}
.choice.boy{background:var(--boy); box-shadow:0 6px 0 var(--boy-shadow)}
.choice.boy:active{box-shadow:0 2px 0 var(--boy-shadow)}
.choice.picked{outline:5px solid var(--butter); outline-offset:3px}

/* Steps */
.steps{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:0; padding:0; list-style:none; font-family:var(--font-display); font-size:17px}
.step{display:inline-flex; align-items:center; gap:8px; padding:5px 14px 5px 5px; border-radius:999px; background:var(--surface); color:var(--ink-soft); border:2px solid var(--line)}
.step b{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:var(--line); color:var(--ink); font-weight:400}
.step[aria-current="step"]{color:var(--ink); border-color:var(--rose)}
.step[aria-current="step"] b{background:var(--girl); color:#fff}

.pill{background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:4px 18px; font-family:var(--font-display); font-size:20px}

/* Scratch card */
.reveal{position:relative; width:min(100%,380px); aspect-ratio:4/3; border-radius:32px; overflow:hidden;
  background:linear-gradient(160deg,var(--reveal-a),var(--reveal-b)); box-shadow:0 0 0 5px var(--surface), 0 12px 28px rgba(120,50,80,.2)}
.reveal-inner{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:4px; padding:10px 14px}
.reveal-inner .sheep{width:46%; flex:none}
.reveal-word{display:flex; flex-direction:column; align-items:flex-start; line-height:1; min-width:0}
.reveal-word .big{font-family:var(--font-display); font-size:clamp(64px,22vw,92px); color:var(--rose-text)}
.reveal-word .small{font-family:var(--font-display); font-size:26px; color:var(--ink)}
.cover{position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; transition:opacity .7s ease}
.cover.gone{opacity:0; pointer-events:none}

/* Result */
.result{display:flex; flex-direction:column; align-items:center; gap:16px; animation:rise .7s ease both}
.result h2{color:var(--rose-text)}
.chips{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.chip{padding:6px 16px; border-radius:999px; background:var(--surface); border:2px solid var(--line); font-family:var(--font-display); font-size:19px}
.chip.sun{background:var(--butter); color:#4B3042; border-color:transparent}
.verdict{font-family:var(--font-display); font-size:22px; color:var(--ink)}

#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(14px)}}
@keyframes twinkle{0%,100%{opacity:.35; transform:scale(.8)}50%{opacity:1; transform:scale(1.1)}}
@keyframes rise{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){
  .stage .sheep,.cloud,.spark,.result{animation:none}
  .cover{transition:none}
}
</style>

<main class="app">

  <section class="screen" id="intro" aria-labelledby="introTitle">
    <span class="eyebrow">지현
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.7 1.1 4.6 2.7h2C13.9 6.1 15.6 5 17.6 5 21 5 23.1 8.4 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg>
      건용</span>
    <div class="stage" aria-hidden="false">
      <svg class="cloud c1" viewBox="0 0 120 56" aria-hidden="true"><circle cx="30" cy="34" r="16"/><circle cx="56" cy="24" r="22"/><circle cx="84" cy="32" r="18"/><circle cx="102" cy="38" r="12"/><rect x="22" y="32" width="86" height="20" rx="10"/></svg>
      <svg class="cloud c2" viewBox="0 0 120 56" aria-hidden="true"><circle cx="30" cy="34" r="16"/><circle cx="56" cy="24" r="22"/><circle cx="84" cy="32" r="18"/><circle cx="102" cy="38" r="12"/><rect x="22" y="32" width="86" height="20" rx="10"/></svg>
      <svg class="spark s1" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0Q11 9 20 10Q11 11 10 20Q9 11 0 10Q9 9 10 0Z"/></svg>
      <svg class="spark s2" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0Q11 9 20 10Q11 11 10 20Q9 11 0 10Q9 9 10 0Z"/></svg>
      <svg class="spark s3" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0Q11 9 20 10Q11 11 10 20Q9 11 0 10Q9 9 10 0Z"/></svg>
      <div class="meadow"></div>
      <div data-sheep="plain" style="display:contents"></div>
    </div>
    <h1 id="introTitle" tabindex="-1">아기 양이<br>찾아왔어요</h1>
    <p>성별을 먼저 맞혀 보고, 손가락으로 문질러서 비밀을 열어 보세요.</p>
    <div class="chips"><span class="chip sun">2027년 5월 만나요</span><span class="chip">양띠 아기</span></div>
    <button class="btn" id="startBtn" type="button">시작하기</button>
  </section>

  <section class="screen" id="guess" aria-labelledby="guessTitle" hidden>
    <ol class="steps" aria-label="진행 단계">
      <li class="step" aria-current="step"><b>1</b>맞혀 보기</li>
      <li class="step"><b>2</b>문질러 보기</li>
    </ol>
    <div class="stage small">
      <svg class="cloud c1" viewBox="0 0 120 56" aria-hidden="true"><circle cx="30" cy="34" r="16"/><circle cx="56" cy="24" r="22"/><circle cx="84" cy="32" r="18"/><circle cx="102" cy="38" r="12"/><rect x="22" y="32" width="86" height="20" rx="10"/></svg>
      <svg class="spark s2" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0Q11 9 20 10Q11 11 10 20Q9 11 0 10Q9 9 10 0Z"/></svg>
      <div class="meadow"></div>
      <div class="bubble" aria-hidden="true">?</div>
      <div data-sheep="plain" style="display:contents"></div>
    </div>
    <h2 id="guessTitle" tabindex="-1">우리 아기는<br>아들일까요, 딸일까요?</h2>
    <p>마음에 드는 쪽을 꾹 눌러 주세요.</p>
    <div class="choices">
      <button class="btn choice boy" type="button" data-guess="boy" aria-pressed="false"><span class="big">아들</span><span class="sub">아들일 것 같아요</span></button>
      <button class="btn choice girl" type="button" data-guess="girl" aria-pressed="false"><span class="big">딸</span><span class="sub">딸일 것 같아요</span></button>
    </div>
  </section>

  <section class="screen" id="scratch" aria-labelledby="scratchTitle" hidden>
    <ol class="steps" aria-label="진행 단계">
      <li class="step"><b>1</b>맞혀 보기</li>
      <li class="step" aria-current="step"><b>2</b>문질러 보기</li>
    </ol>
    <span class="pill" id="pick"></span>
    <h2 id="scratchTitle" tabindex="-1">손가락으로<br>쓱쓱 문질러 보세요</h2>
    <div class="reveal" id="panel">
      <div class="reveal-inner">
        <div data-sheep="bow" style="display:contents"></div>
        <div class="reveal-word"><span class="big">딸</span><span class="small">이에요!</span></div>
      </div>
      <canvas class="cover" id="cover" aria-hidden="true"></canvas>
    </div>
    <button class="btn ghost" id="openBtn" type="button">한 번에 열기</button>

    <div class="result" id="result" aria-live="polite" hidden>
      <h2>축하해요, 딸이에요!</h2>
      <p class="verdict" id="verdict"></p>
      <p>지현 · 건용 부부에게 사랑스러운 공주님이 찾아와요. 모두 함께 기다려 주세요.</p>
      <div class="chips"><span class="chip sun">2027년 5월 출산 예정</span><span class="chip">정미년 양띠</span></div>
      <button class="btn ghost" id="againBtn" type="button">처음부터 다시 하기</button>
    </div>
  </section>

</main>
<canvas id="confetti" aria-hidden="true" hidden></canvas>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Sheep drawing ---------- */
  function sheep(bow){
    var wool = [[70,152,44],[170,152,44],[96,182,40],[144,182,40],[120,142,50],[84,118,32],[156,118,32]];
    var tuft = [[100,64,17],[120,56,19],[140,64,17],[88,78,13],[152,78,13]];
    function circles(list, extra, cls){
      return list.map(function(c){ return '<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+(c[2]+extra)+'" class="'+cls+'"/>'; }).join('');
    }
    var ribbon = bow
      ? '<path class="sh-bow" d="M152 60L132 48Q125 60 132 73Z"/><path class="sh-bow" d="M152 60L172 48Q179 60 172 73Z"/><circle class="sh-bow-mid" cx="152" cy="60" r="7"/>'
      : '';
    return '<svg class="sheep" viewBox="0 0 240 238" role="img" aria-label="귀여운 아기 양">'
      + '<ellipse class="sh-shadow" cx="120" cy="232" rx="72" ry="6"/>'
      + '<rect class="sh-leg" x="92" y="208" width="18" height="24" rx="9"/><rect class="sh-leg" x="130" y="208" width="18" height="24" rx="9"/>'
      + circles(wool,3,'sh-edge') + circles(wool,0,'sh-wool')
      + '<ellipse class="sh-ear" cx="74" cy="102" rx="15" ry="9" transform="rotate(-24 74 102)"/>'
      + '<ellipse class="sh-ear" cx="166" cy="102" rx="15" ry="9" transform="rotate(24 166 102)"/>'
      + '<ellipse class="sh-face" cx="120" cy="104" rx="45" ry="40"/>'
      + circles(tuft,3,'sh-edge') + circles(tuft,0,'sh-wool')
      + ribbon
      + '<circle class="sh-ink" cx="104" cy="106" r="5.5"/><circle class="sh-ink" cx="136" cy="106" r="5.5"/>'
      + '<circle class="sh-hi" cx="106" cy="104" r="1.9"/><circle class="sh-hi" cx="138" cy="104" r="1.9"/>'
      + '<circle class="sh-cheek" cx="91" cy="120" r="8"/><circle class="sh-cheek" cx="149" cy="120" r="8"/>'
      + '<ellipse class="sh-ink" cx="120" cy="115" rx="5" ry="3.4"/>'
      + '<path class="sh-mouth" d="M112 122q4 5 8 0q4 5 8 0"/>'
      + '</svg>';
  }
  document.querySelectorAll('[data-sheep]').forEach(function(el){
    el.innerHTML = sheep(el.getAttribute('data-sheep') === 'bow');
  });

  /* ---------- Screens ---------- */
  var screens = { intro:$('#intro'), guess:$('#guess'), scratch:$('#scratch') };
  var guess = null, revealed = false, touched = false;

  function show(name){
    Object.keys(screens).forEach(function(k){ screens[k].hidden = (k !== name); });
    window.scrollTo(0, 0);
    var h = screens[name].querySelector('h1,h2');
    if (h) h.focus({ preventScroll:true });
  }

  $('#startBtn').addEventListener('click', function(){ show('guess'); });

  document.querySelectorAll('[data-guess]').forEach(function(btn){
    btn.addEventListener('click', function(){
      guess = btn.getAttribute('data-guess');
      document.querySelectorAll('[data-guess]').forEach(function(b){
        var on = b === btn;
        b.classList.toggle('picked', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      setTimeout(function(){
        $('#pick').textContent = '내가 고른 답: ' + (guess === 'girl' ? '딸' : '아들');
        show('scratch');
        requestAnimationFrame(function(){ initCover(); });
      }, 450);
    });
  });

  /* ---------- Scratch cover ---------- */
  var cv = $('#cover');
  var ctx = cv.getContext('2d', { willReadFrequently:true });
  var W = 0, H = 0, dpr = 1, last = null, drawing = false, lastCheck = 0;

  function initCover(){
    var r = cv.getBoundingClientRect();
    if (!r.width) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#DCD0EE';
    ctx.fillRect(0, 0, W, H);
    var i, x, y, rad;
    for (i = 0; i < 240; i++){
      x = Math.random() * W; y = Math.random() * H; rad = 12 + Math.random() * 16;
      ctx.fillStyle = Math.random() < 0.72 ? 'rgba(255,255,255,0.92)' : 'rgba(196,178,226,0.75)';
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
    }
    var pw = Math.min(W - 40, 270), ph = 76, px = (W - pw) / 2, py = (H - ph) / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.96)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(px, py, pw, ph, 38); else ctx.rect(px, py, pw, ph);
    ctx.fill();
    ctx.fillStyle = '#6A3F66';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '26px Jua, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    ctx.fillText('여기를 문질러요', W / 2, py + 27);
    ctx.font = '19px Jua, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#8A5F86';
    ctx.fillText('손가락으로 쓱쓱', W / 2, py + 54);
  }

  if (document.fonts && document.fonts.load){
    document.fonts.load('26px Jua', '문질러요손가락으로쓱').then(function(){
      if (!touched && !revealed && !screens.scratch.hidden) initCover();
    }).catch(function(){});
  }
  window.addEventListener('resize', function(){
    if (!touched && !revealed && !screens.scratch.hidden) initCover();
  });

  function point(e){
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function scratchLine(a, b){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(40, W * 0.12);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
  function coverage(){
    var d = ctx.getImageData(0, 0, cv.width, cv.height).data, clear = 0, total = 0, i;
    for (i = 3; i < d.length; i += 28){ total++; if (d[i] < 40) clear++; }
    return total ? clear / total : 0;
  }
  function check(force){
    var now = Date.now();
    if (!force && now - lastCheck < 250) return;
    lastCheck = now;
    if (coverage() > 0.45) reveal();
  }
  cv.addEventListener('pointerdown', function(e){
    if (revealed) return;
    drawing = true; touched = true;
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    last = point(e); scratchLine(last, last);
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function(e){
    if (!drawing || revealed) return;
    var p = point(e); scratchLine(last, p); last = p; check(false);
  });
  function stop(){ if (!drawing) return; drawing = false; check(true); }
  cv.addEventListener('pointerup', stop);
  cv.addEventListener('pointercancel', stop);

  $('#openBtn').addEventListener('click', reveal);

  /* ---------- Reveal ---------- */
  function reveal(){
    if (revealed) return;
    revealed = true; drawing = false;
    cv.classList.add('gone');
    $('#openBtn').hidden = true;
    $('#scratchTitle').hidden = true;
    $('#verdict').textContent = guess === 'girl'
      ? '정답이에요! 딸이라고 맞히셨네요.'
      : '아쉬워요. 그래도 딸이라서 더 반가운 소식이에요.';
    var res = $('#result');
    res.hidden = false;
    setTimeout(function(){
      res.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
    }, 500);
    confetti();
  }

  $('#againBtn').addEventListener('click', function(){
    guess = null; revealed = false; touched = false;
    document.querySelectorAll('[data-guess]').forEach(function(b){ b.classList.remove('picked'); b.setAttribute('aria-pressed', 'false'); });
    cv.classList.remove('gone');
    $('#openBtn').hidden = false;
    $('#scratchTitle').hidden = false;
    $('#result').hidden = true;
    show('intro');
  });

  /* ---------- Confetti ---------- */
  function heart(c, s){
    c.beginPath();
    c.moveTo(0, s * 0.35);
    c.bezierCurveTo(-s * 0.9, -s * 0.3, -s * 0.4, -s * 0.95, 0, -s * 0.4);
    c.bezierCurveTo(s * 0.4, -s * 0.95, s * 0.9, -s * 0.3, 0, s * 0.35);
    c.fill();
  }
  function confetti(){
    if (reduce) return;
    var cc = $('#confetti'), c = cc.getContext('2d');
    var d = Math.min(window.devicePixelRatio || 1, 2);
    cc.hidden = false;
    cc.width = Math.round(window.innerWidth * d); cc.height = Math.round(window.innerHeight * d);
    var colors = ['#F0719B','#FFD66B','#7DB8EC','#9FDDBF','#FFB4CB','#C9A7F0'];
    var parts = [], i;
    for (i = 0; i < 130; i++){
      parts.push({
        x: Math.random() * cc.width, y: -Math.random() * cc.height * 0.7,
        s: (6 + Math.random() * 8) * d,
        vx: (Math.random() - 0.5) * 2.4 * d, vy: (1.8 + Math.random() * 3.2) * d,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.22,
        col: colors[i % colors.length], heart: Math.random() < 0.35
      });
    }
    var t0 = performance.now();
    function frame(t){
      c.clearRect(0, 0, cc.width, cc.height);
      var alive = false;
      parts.forEach(function(p){
        p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.015 * d;
        if (p.y < cc.height + 30 * d) alive = true;
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.col;
        if (p.heart) heart(c, p.s); else c.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66);
        c.restore();
      });
      if (alive && t - t0 < 6500) requestAnimationFrame(frame);
      else { c.clearRect(0, 0, cc.width, cc.height); cc.hidden = true; }
    }
    requestAnimationFrame(frame);
  }
})();
</script>

</body></html>
